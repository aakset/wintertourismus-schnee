   services:
     db:
       image: postgres:16
       container_name: wintertourismus_db
       environment:
         POSTGRES_USER: ${PG_USER}
         POSTGRES_PASSWORD: ${PG_PASSWORD}
         POSTGRES_DB: wintertourismus
       ports:
         - "5432:5432"
       volumes:
         - pgdata:/var/lib/postgresql/data
   volumes:
     pgdata: